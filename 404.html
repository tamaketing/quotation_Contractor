<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>ไม่พบหน้านี้ — ระบบเอกสารรับเหมา</title>
<style>
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;
       font-family:"Sarabun",system-ui,sans-serif;background:#eef2f7;color:#111827}
  .box{max-width:420px;text-align:center;background:#fff;border:1px solid #e5e7eb;border-radius:14px;
       padding:34px 28px;box-shadow:0 10px 24px rgba(15,23,42,.08)}
  .ic{width:56px;height:56px;border-radius:14px;background:#c2410c;color:#fff;display:flex;
      align-items:center;justify-content:center;font-size:26px;margin:0 auto 14px}
  h1{margin:0 0 8px;font-size:20px;color:#1a1f36}
  p{margin:0 0 20px;font-size:13px;color:#6b7280;line-height:1.7}
  a{display:inline-block;background:#c2410c;color:#fff;text-decoration:none;font-size:13px;
    font-weight:600;padding:10px 20px;border-radius:8px}
  a:hover{background:#9a3412}
</style>
</head>
<body>
  <div class="box">
    <div class="ic">🏗️</div>
    <h1>ไม่พบหน้านี้</h1>
    <p>ลิงก์อาจพิมพ์ผิดหรือไฟล์ถูกย้าย<br>กลับไปหน้าแรกเพื่อเลือกเครื่องมือได้เลย</p>
    <a href="/index.html">กลับหน้าแรก</a>
  </div>
</body>
</html>
