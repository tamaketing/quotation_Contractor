<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>ตั้งรหัสผ่านใหม่ — ระบบเอกสารรับเหมา</title>
<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{font-family:"Sarabun",sans-serif;background:#eef2f7;color:#111827;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:30px 18px;line-height:1.6}
  .card{width:100%;max-width:440px;background:#fff;border:1px solid #e5e7eb;border-radius:14px;padding:26px;box-shadow:0 4px 16px rgba(0,0,0,.08)}
  .mark{width:50px;height:50px;border-radius:13px;background:#c2410c;color:#fff;display:flex;align-items:center;justify-content:center;font-size:23px;margin:0 auto 10px}
  h1{margin:0 0 4px;font-size:20px;color:#1a1f36;text-align:center}
  .sub{margin:0 0 18px;font-size:12.5px;color:#6b7280;text-align:center}
  label{display:block;font-size:12.5px;font-weight:600;color:#374151;margin:10px 0 4px}
  input{width:100%;padding:10px 12px;border:1px solid #d1d5db;border-radius:8px;font-family:inherit;font-size:14px}
  input:focus{outline:none;border-color:#c2410c;box-shadow:0 0 0 3px rgba(194,65,12,.12)}
  button{width:100%;margin-top:14px;padding:10px 14px;border-radius:8px;border:1px solid #c2410c;background:#c2410c;color:#fff;font-family:inherit;font-size:14px;font-weight:600;cursor:pointer}
  button:hover{filter:brightness(.95)}
  button:disabled{opacity:.6;cursor:wait}
  .msg{margin-top:14px;font-size:13px;text-align:center;line-height:1.6;padding:9px 11px;border-radius:8px;display:none}
  .msg.err{display:block;color:#991b1b;background:#fef2f2;border:1px solid #fecaca}
  .msg.ok{display:block;color:#065f46;background:#ecfdf5;border:1px solid #a7f3d0}
  .back{display:block;text-align:center;margin-top:16px;font-size:12.5px;color:#c2410c;text-decoration:none}
  .back:hover{text-decoration:underline}
  .hint{font-size:11.5px;color:#6b7280;margin:6px 0 0}
</style>
</head>
<body>
<div class="card">
  <div class="mark">🔑</div>
  <h1>ตั้งรหัสผ่านใหม่</h1>
  <p class="sub">ระบบเอกสารรับเหมา</p>

  <div id="formBox">
    <label for="pwd">รหัสผ่านใหม่</label>
    <input id="pwd" type="password" placeholder="อย่างน้อย 6 ตัวอักษร" autocomplete="new-password">
    <p class="hint">แนะนำให้ผสมตัวอักษรและตัวเลข และไม่ใช้รหัสเดิม</p>
    <label for="pwd2">ยืนยันรหัสผ่านใหม่</label>
    <input id="pwd2" type="password" placeholder="พิมพ์อีกครั้ง" autocomplete="new-password">
    <button id="submitBtn" type="button">ตั้งรหัสผ่านใหม่</button>
  </div>

  <div id="msg" class="msg"></div>
  <a class="back" href="/" id="backLink">← กลับไปหน้าเข้าสู่ระบบ</a>
</div>

<script src="assets/api.js"></script>
<script>
(function () {
  const params = new URLSearchParams(location.search);
  const token = (params.get('token') || '').trim();
  const msg = document.getElementById('msg');
  const formBox = document.getElementById('formBox');

  function show(text, type) {
    msg.textContent = text;
    msg.className = 'msg ' + (type || 'err');
  }

  if (!token) {
    formBox.style.display = 'none';
    show('ลิงก์ไม่ถูกต้องหรือไม่มี token — กรุณาขอลิงก์รีเซ็ตใหม่จากหน้าเข้าสู่ระบบ', 'err');
    return;
  }

  async function submit() {
    const pwd = document.getElementById('pwd').value;
    const pwd2 = document.getElementById('pwd2').value;
    if (!pwd || pwd.length < 6) return show('รหัสผ่านต้องยาวอย่างน้อย 6 ตัวอักษร', 'err');
    if (pwd !== pwd2) return show('รหัสผ่านทั้งสองช่องไม่ตรงกัน', 'err');

    const btn = document.getElementById('submitBtn');
    btn.disabled = true;
    btn.textContent = 'กำลังบันทึก...';
    try {
      const res = await API.resetPassword(token, pwd);
      API.setToken(null); API.setUser(null);
      formBox.style.display = 'none';
      show((res && res.message) || 'ตั้งรหัสผ่านใหม่เรียบร้อยแล้ว', 'ok');
      setTimeout(() => { location.href = '/'; }, 2200);
    } catch (e) {
      show(e.message || 'ตั้งรหัสผ่านไม่สำเร็จ', 'err');
      btn.disabled = false;
      btn.textContent = 'ตั้งรหัสผ่านใหม่';
    }
  }

  document.getElementById('submitBtn').addEventListener('click', submit);
  document.getElementById('pwd2').addEventListener('keydown', e => { if (e.key === 'Enter') submit(); });
})();
</script>
</body>
</html>
